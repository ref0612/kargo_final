<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2E">
<title>KARGO · Mockup</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1B2E'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' transform='rotate(45 16 16)' fill='%23FF7A2F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="desktop">
<a class="skip" href="#view" data-i18n="skip">Saltar al contenido</a>

<div id="demobar" role="toolbar" aria-label="Demo">
  <span class="brand"><span class="mark" aria-hidden="true"></span>KARGO<small>mockup</small></span>
  <label class="who">
    <span data-i18n="demo.viewAs">Ver como</span>
    <select id="who"></select>
  </label>
  <div class="seg" role="group" data-i18n-aria="lang.label" aria-label="Idioma">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="seg seg-view" role="group" data-i18n-aria="view.label" aria-label="Vista">
    <button type="button" data-viewmode="mobile" data-ic="phone" data-i18n-aria="view.mobile" aria-label="Vista móvil" aria-pressed="false"></button>
    <button type="button" data-viewmode="desktop" data-ic="monitor" data-i18n-aria="view.desktop" aria-label="Vista escritorio" aria-pressed="true"></button>
  </div>
  <button id="reset" type="button" class="ghost-btn"><span data-ic="reset"></span><span class="lbl" data-i18n="demo.reset">Reiniciar demo</span></button>
</div>

<div id="stage">
  <div id="device">
    <div id="app">
      <aside id="side"></aside>
      <div id="main">
        <header id="top"></header>
        <main id="view" tabindex="-1" aria-live="polite"></main>
      </div>
      <nav id="tabbar"></nav>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
